<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Verity Screen Check</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="brand">
          <img src="logo.png" alt="" width="40" height="40" /><span class="eyebrow">Verity.</span>
        </div>
        <h1>Check the page.</h1>
        <p>Select an area. We’ll read the claim and check its evidence.</p>
      </header>
      <div class="capture-actions">
        <button id="capture" type="button" class="secondary">Search on screen</button
        ><button id="selection" type="button" class="secondary">Use selected text</button>
      </div>
      <p class="muted capture-note">
        Selecting an area sends only that crop for reading and checking. Screenshots are not saved.
      </p>
      <section id="preview" hidden>
        <img id="screenshot" alt="The selected screen area" />
        <button id="discard" class="secondary">Remove capture</button>
      </section>
      <div id="choices" aria-label="Extracted claims"></div>
      <form id="check-form">
        <label for="claim">Claim to verify</label
        ><textarea
          id="claim"
          rows="5"
          minlength="8"
          maxlength="2000"
          required
          placeholder="Your captured claim appears here. You can also type one."
        ></textarea>
        <div class="count" id="count">0 / 2000</div>
        <button id="verify" type="submit">Verify claim</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <p id="error" role="alert" hidden></p>
      <section id="result" aria-label="Fact-check result" hidden></section>
    </main>
    <script src="panel.js"></script>
  </body>
</html>
