services:
  verity:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DEMO_MODE: ${DEMO_MODE:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      PERSISTENCE_ENABLED: ${PERSISTENCE_ENABLED:-false}
      DATABASE_PATH: /app/data/verity.sqlite
      MAX_CONCURRENCY: ${MAX_CONCURRENCY:-4}
      MAX_PROVIDER_CALLS: ${MAX_PROVIDER_CALLS:-1000}
    volumes:
      - verity-data:/app/data
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    profiles: [postgres]
    environment:
      POSTGRES_DB: verity
      POSTGRES_USER: verity
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verity"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  verity-data:
  postgres-data:
